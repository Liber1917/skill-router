[project]
name = "skill-router"
version = "0.1.0"
description = "Cross-platform natural language router for agent skills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Liber1917" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
    "numpy>=2.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.50"]

[project.urls]
Homepage = "https://github.com/Liber1917/skill-router"
Repository = "https://github.com/Liber1917/skill-router"
Issues = "https://github.com/Liber1917/skill-router/issues"

[project.scripts]
skill-route = "skill_router.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "pyright>=1.1.409",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/skill_router/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["skill_router"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_router"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
